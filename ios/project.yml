name: Slippy

options:
  bundleIdPrefix: app.slippy
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

settings:
  base:
    # Xcode 26 defaults this to YES, which races with SwiftPM's modulemap
    # generation for ObjC-only package targets (AppAuthCore, GTMSessionFetcherCore,
    # GTMAppAuthCore pulled in transitively by GoogleSignIn) causing intermittent
    # "module map file not found" / "unable to resolve module dependency" failures.
    CLANG_ENABLE_EXPLICIT_MODULES: NO
    SWIFT_ENABLE_EXPLICIT_MODULES: NO

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.3.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
  FacebookSDK:
    url: https://github.com/facebook/facebook-ios-sdk
    from: "17.0.0"
  LineSDK:
    url: https://github.com/line/line-sdk-ios-swift
    from: "5.8.0"
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.15.0"

targets:
  Slippy:
    type: application
    platform: iOS
    sources:
      - path: Slippy
      - path: SlippyShared
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: FacebookSDK
        product: FacebookLogin
        suppressWarnings: true
      - package: LineSDK
        product: LineSDK
      - package: LiveKit
        product: LiveKit
      - target: SlippyShare
        embed: true
      - target: SlippyWatch
        embed: true
    entitlements:
      path: Slippy/Slippy.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.slippy.shared
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.slippy.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: Slippy/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Team ID = the OU field of the signing certificate, NOT the code in
        # parentheses after the Apple ID in its common name. This was
        # "N59T65323B" — that is chainimit@hotmail.com's personal Apple ID
        # identifier, not a team — so Xcode reported "No Account for Team
        # N59T65323B" and found no provisioning profiles for any target. The
        # certificate (OU) and all three profiles are issued to DBQN87K35F.
        #
        # Editing the team in Xcode's UI does not stick: `xcodegen generate`
        # rewrites the project from this file. Change it here.
        DEVELOPMENT_TEAM: "DBQN87K35F"
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CFLAGS: $(inherited) -Wno-deprecated-declarations
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: Slippy/App/Info.plist
      properties:
        CFBundleDisplayName: Slippy
        CFBundleShortVersionString: "1.0.0"
        NSCameraUsageDescription: "ถ่ายภาพเอกสารเพื่ออัปโหลดเข้าระบบ Slippy"
        NSPhotoLibraryUsageDescription: "เลือกรูปเอกสารจากคลังภาพ"
        NSPhotoLibraryAddUsageDescription: "บันทึกภาพใบเสร็จต้นฉบับลงในคลังภาพของคุณ"
        NSFaceIDUsageDescription: "ใช้ Face ID เพื่อเข้าสู่ระบบ Slippy อย่างปลอดภัย"
        NSLocationWhenInUseUsageDescription: "Slippy ใช้ตำแหน่งของคุณเพื่อแชร์ให้เพื่อนร่วมทริปเห็นชั่วคราว เฉพาะตอนที่คุณเปิดแชร์เท่านั้น"
        NSMicrophoneUsageDescription: "Slippy ใช้ไมโครโฟนสำหรับการโทรคุยกับเพื่อนร่วมทริป"

        # ── Google Sign-In ─────────────────────────────────────────────
        GIDClientID: "940654280425-19pvlqjqssgv3oe8sd7im9nm1an62jp9.apps.googleusercontent.com"

        # ── Facebook Login ─────────────────────────────────────────────
        FacebookAppID: "998800032696110"
        FacebookClientToken: "2d7cf6af3befe5ff2412b70031943702"
        FacebookDisplayName: "Slippy"

        # ── URL Schemes ────────────────────────────────────────────────
        CFBundleURLTypes:
          # Slippy deep-link (Supabase OAuth callback)
          - CFBundleURLName: app.slippy.ios
            CFBundleURLSchemes:
              - slippy
          # Google Sign-In callback (reverse client ID)
          - CFBundleURLName: com.google.GIDSignIn
            CFBundleURLSchemes:
              - com.googleusercontent.apps.940654280425-19pvlqjqssgv3oe8sd7im9nm1an62jp9
          # Facebook Login callback
          - CFBundleURLName: facebook
            CFBundleURLSchemes:
              - fb998800032696110
          # LINE SDK web-fallback callback (when LINE app is not installed)
          - CFBundleURLName: line3rdp
            CFBundleURLSchemes:
              - line3rdp.app.slippy.ios

        # ── Queried schemes (for LINE / Facebook) ─────────────────────
        LSApplicationQueriesSchemes:
          - lineauth2
          - line3rdp.app.slippy.ios
          - line
          - fbapi
          - fb-messenger-share-api
          - fbauth2
          - fbshareextension

        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  SlippyWatch:
    type: application
    platform: watchOS
    sources:
      - path: SlippyWatch
      - path: SlippyShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.slippy.ios.watchkitapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: SlippyWatch/App/Info.plist
        # Team ID = the OU field of the signing certificate, NOT the code in
        # parentheses after the Apple ID in its common name. This was
        # "N59T65323B" — that is chainimit@hotmail.com's personal Apple ID
        # identifier, not a team — so Xcode reported "No Account for Team
        # N59T65323B" and found no provisioning profiles for any target. The
        # certificate (OU) and all three profiles are issued to DBQN87K35F.
        #
        # Editing the team in Xcode's UI does not stick: `xcodegen generate`
        # rewrites the project from this file. Change it here.
        DEVELOPMENT_TEAM: "DBQN87K35F"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: SlippyWatch/App/Info.plist
      properties:
        CFBundleDisplayName: "Slippy Play"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSHealthShareUsageDescription: "Slippy Play ขอใช้ข้อมูล Heart Rate และ Calories เพื่อวิเคราะห์การเล่นแบดมินตัน"
        NSHealthUpdateUsageDescription: "Slippy Play บันทึก Workout Session ลง Health App"
        NSMotionUsageDescription: "Slippy Play ขอใช้ข้อมูลการเคลื่อนไหวจาก Apple Watch เพื่อตรวจจับการตีลูก"
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.slippy.ios

  SlippyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SlippyShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.slippy.ios.share
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: SlippyShare/Info.plist
        # Team ID = the OU field of the signing certificate, NOT the code in
        # parentheses after the Apple ID in its common name. This was
        # "N59T65323B" — that is chainimit@hotmail.com's personal Apple ID
        # identifier, not a team — so Xcode reported "No Account for Team
        # N59T65323B" and found no provisioning profiles for any target. The
        # certificate (OU) and all three profiles are issued to DBQN87K35F.
        #
        # Editing the team in Xcode's UI does not stick: `xcodegen generate`
        # rewrites the project from this file. Change it here.
        DEVELOPMENT_TEAM: "DBQN87K35F"
    info:
      path: SlippyShare/Info.plist
      properties:
        CFBundleDisplayName: "Slippy Share"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 10
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionPointIdentifier: com.apple.share-services
    entitlements:
      path: SlippyShare/SlippyShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.slippy.shared

schemes:
  Slippy:
    build:
      targets:
        Slippy: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
